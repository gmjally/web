<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publications — Dr. Ghulam Mubashar Hassan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F1C3F; --navy-mid: #1A2D5A; --blue: #2E5BA8; --blue-light: #4A7BD4;
    --gold: #C4922A; --gold-light: #E8B84B; --bg: #F7F5F0; --bg-alt: #EFEDE8;
    --text: #1A1A1A; --text-mid: #3C3C3C; --text-muted: #6B6B6B; --border: #D8D5CE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --navy: #0A1428; --navy-mid: #122040; --blue: #4A7BD4; --blue-light: #6B9AE8;
      --gold: #E8B84B; --gold-light: #F0CC7A; --bg: #111827; --bg-alt: #1A2436;
      --text: #EEE9E0; --text-mid: #C8C3B8; --text-muted: #8A8580; --border: #2A3548;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.7; color: var(--text); background: var(--bg); }

  .gm-name { font-weight: 700; color: var(--gold); }

  .page-header { background: var(--navy-mid); padding: 3rem 4rem 2.75rem; position: relative; overflow: hidden; }
  .page-header::before { content: ''; position: absolute; top: -80px; right: -60px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(196,146,42,0.12) 0%, transparent 70%); }
  .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; font-weight: 500; color: rgba(255,255,255,0.5); text-decoration: none; margin-bottom: 1.25rem; transition: color 0.15s; }
  .back-link:hover { color: var(--gold-light); }
  .back-link svg { width: 14px; height: 14px; }
  .page-eyebrow { font-size: 0.72rem; font-weight: 600; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.6rem; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 4vw, 3rem); color: #fff; line-height: 1.15; margin-bottom: 0.75rem; }
  .page-subtitle { font-size: 0.88rem; color: rgba(255,255,255,0.55); }

  .layout { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 200px); }
  .toc { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg-alt); padding: 2rem 1.25rem; border-right: 1px solid var(--border); }
  .toc-label { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
  .toc a { display: block; font-size: 0.78rem; color: var(--text-muted); text-decoration: none; padding: 0.35rem 0.5rem; border-left: 2px solid transparent; transition: color 0.15s, border-color 0.15s; line-height: 1.3; margin-bottom: 0.1rem; }
  .toc a:hover { color: var(--text); border-left-color: var(--gold); }

  .content { padding: 3rem 4rem 5rem; max-width: 820px; }

  .pub-section { margin-bottom: 3.5rem; }
  .pub-section-title { font-family: 'DM Serif Display', serif; font-size: 1.35rem; color: var(--navy); padding-bottom: 0.6rem; border-bottom: 2px solid var(--gold); margin-bottom: 1.5rem; scroll-margin-top: 2rem; }
  @media (prefers-color-scheme: dark) { .pub-section-title { color: var(--blue-light); } }

  .pub-item { padding: 0.9rem 0; border-bottom: 1px solid var(--border); font-size: 0.83rem; color: var(--text-mid); line-height: 1.6; }
  .pub-item:last-child { border-bottom: none; }
  .pub-item a { color: var(--blue); text-decoration: none; }
  .pub-item a:hover { text-decoration: underline; }
  .pub-count { font-size: 0.72rem; color: var(--text-muted); margin-left: 0.5rem; font-weight: 400; }

  .copyright-note { margin-top: 3rem; padding: 1.25rem 1.5rem; background: var(--bg-alt); border-left: 3px solid var(--border); font-size: 0.75rem; color: var(--text-muted); line-height: 1.6; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .toc { display: none; }
    .page-header { padding: 2.5rem 1.5rem 2rem; }
    .content { padding: 2rem 1.5rem 4rem; }
  }
</style>
</head>
<body>

<header class="page-header">
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12L6 8l4-4"/></svg>
    Back to profile
  </a>
  <div class="page-eyebrow">University of Western Australia</div>
  <h1 class="page-title">Publications</h1>
  <p class="page-subtitle">Dr. Ghulam Mubashar Hassan — Department of Computer Science &amp; Software Engineering</p>
</header>

<div class="layout">
  <nav class="toc">
    <div class="toc-label">Jump to</div>
    <a href="#book-chapters">Book Chapters</a>
    <a href="#datasets">Datasets</a>
    <a href="#journal-papers">Journal Papers</a>
    <a href="#conference-papers">Conference Papers</a>
  </nav>

  <div class="content" id="pub-content">
    <p style="color:var(--text-muted);font-size:0.85rem">Loading publications…</p>
  </div>
</div>

<script>
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function gmName(s) {
  return String(s||'').replace(/\[GM\]/g,'<span class="gm-name">Ghulam Mubashar Hassan</span>');
}

function renderSection(id, title, items) {
  if (!items || items.length === 0) return '';
  const text = item => typeof item === 'object' ? item.text : item;
  return `
    <div class="pub-section" id="${id}">
      <h2 class="pub-section-title">${title} <span class="pub-count">(${items.length})</span></h2>
      ${items.map(item => `<div class="pub-item">${gmName(text(item))}</div>`).join('')}
    </div>`;
}

fetch('content.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    const pubs = data.publications || {};
    const html =
      renderSection('book-chapters',    'Book Chapters',     pubs.bookChapters) +
      renderSection('datasets',         'Datasets',          pubs.datasets) +
      renderSection('journal-papers',   'Journal Papers',    pubs.journalPapers) +
      renderSection('conference-papers','Conference Papers', pubs.conferencePapers) +
      `<div class="copyright-note">
        <strong>Copyright Notice:</strong> This material is presented to ensure timely dissemination of scholarly and technical work. Copyright and all rights therein are retained by authors or by other copyright holders. All persons copying this information are expected to adhere to the terms and constraints invoked by each author's copyright.
      </div>`;
    document.getElementById('pub-content').innerHTML = html ||
      '<p style="color:var(--text-muted)">No publications found in content.json.</p>';
  })
  .catch(err => {
    document.getElementById('pub-content').innerHTML =
      '<p style="color:var(--text-muted);padding:2rem 0">Could not load publications. Please ensure content.json is in the same folder.</p>';
    console.warn('publications: could not load content.json:', err.message);
  });
</script>
</body>
</html>
