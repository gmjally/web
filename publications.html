// Replace [GM] with styled name span
function gmName(text) {
  return text.replace(/\[GM\]/g, '<span class="gm-name">Ghulam Mubashar Hassan</span>');
}

function renderSection(id, title, items) {
  if (!items || items.length === 0) return '';
  const entries = items.map(item =>
    `<div class="pub-item">${gmName(item)}</div>`
  ).join('');
  return `
    <div class="pub-section" id="${id}">
      <h2 class="pub-section-title">${title} <span class="pub-count">(${items.length})</span></h2>
      ${entries}
    </div>`;
}

function render(data) {
  const pubs = data.publications || {};
  const content = document.getElementById('pub-content');

  const html =
    renderSection('book-chapters',    'Book Chapters',      pubs.bookChapters) +
    renderSection('datasets',         'Datasets',           pubs.datasets) +
    renderSection('journal-papers',   'Journal Papers',     pubs.journalPapers) +
    renderSection('conference-papers','Conference Papers',  pubs.conferencePapers) +
    `<div class="copyright-note">
      <strong>Copyright Notice:</strong> This material is presented to ensure timely dissemination of scholarly and technical work. Copyright and all rights therein are retained by authors or by other copyright holders. All persons copying this information are expected to adhere to the terms and constraints invoked by each author's copyright.
    </div>`;

  content.innerHTML = html;
}

fetch('content.json')

  .then(data => render(data))
