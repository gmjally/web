<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grants — Dr. Ghulam Mubashar Hassan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F1C3F; --navy-mid: #1A2D5A; --blue: #2E5BA8; --blue-light: #4A7BD4;
    --gold: #C4922A; --gold-light: #E8B84B; --bg: #F7F5F0; --bg-alt: #EFEDE8;
    --text: #1A1A1A; --text-mid: #3C3C3C; --text-muted: #6B6B6B; --border: #D8D5CE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --navy: #0A1428; --navy-mid: #122040; --blue: #4A7BD4; --blue-light: #6B9AE8;
      --gold: #E8B84B; --gold-light: #F0CC7A; --bg: #111827; --bg-alt: #1A2436;
      --text: #EEE9E0; --text-mid: #C8C3B8; --text-muted: #8A8580; --border: #2A3548;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.7; color: var(--text); background: var(--bg); }

  .gm-name { font-weight: 700; color: var(--gold); }

  .page-header { background: var(--navy-mid); padding: 3rem 4rem 2.75rem; position: relative; overflow: hidden; }
  .page-header::before { content: ''; position: absolute; top: -80px; right: -60px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(196,146,42,0.12) 0%, transparent 70%); }
  .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; font-weight: 500; color: rgba(255,255,255,0.5); text-decoration: none; margin-bottom: 1.25rem; transition: color 0.15s; }
  .back-link:hover { color: var(--gold-light); }
  .back-link svg { width: 14px; height: 14px; }
  .page-eyebrow { font-size: 0.72rem; font-weight: 600; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.6rem; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 4vw, 3rem); color: #fff; line-height: 1.15; margin-bottom: 0.75rem; }
  .page-subtitle { font-size: 0.88rem; color: rgba(255,255,255,0.55); }
  .total-badge { display: inline-block; margin-top: 1.25rem; font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--gold-light); }
  .total-label { display: block; font-size: 0.72rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.1rem; }

  .content { max-width: 860px; margin: 0 auto; padding: 3rem 4rem 5rem; }

  .grant-item { padding: 1.5rem 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 2rem; align-items: start; }
  .grant-item:last-child { border-bottom: none; }
  .grant-title { font-size: 0.92rem; font-weight: 600; color: var(--text); line-height: 1.45; margin-bottom: 0.35rem; }
  .grant-authors { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 0.25rem; }
  .grant-funder { font-size: 0.8rem; color: var(--blue); font-weight: 500; }
  .grant-right { text-align: right; }
  .grant-amount { font-size: 0.92rem; font-weight: 700; color: var(--gold); white-space: nowrap; }
  .grant-year { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

  @media (max-width: 640px) {
    .page-header { padding: 2.5rem 1.5rem 2rem; }
    .content { padding: 2rem 1.5rem 4rem; }
    .grant-item { grid-template-columns: 1fr; }
    .grant-right { text-align: left; margin-top: 0.25rem; }
  }
</style>
</head>
<body>

<header class="page-header">
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12L6 8l4-4"/></svg>
    Back to profile
  </a>
  <div class="page-eyebrow">University of Western Australia</div>
  <h1 class="page-title">Research Grants</h1>
  <p class="page-subtitle">Dr. Ghulam Mubashar Hassan — Department of Computer Science &amp; Software Engineering</p>
  <div class="total-badge" id="total-badge">—</div>
  <span class="total-label">Total funding awarded</span>
</header>

<div class="content" id="grants-content">
  <p style="color:var(--text-muted);font-size:0.85rem">Loading grants…</p>
</div>

<script>
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function gmName(s) {
  return String(s||'').replace(/\[GM\]/g,'<span class="gm-name">Ghulam Mubashar Hassan</span>');
}

fetch('content.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    const grants = data.grants || {};
    document.getElementById('total-badge').textContent = grants.total || '';
    const items = grants.items || [];
    const html = items.map(g => `
      <div class="grant-item">
        <div>
          <div class="grant-title">${esc(g.title||'')}</div>
          <div class="grant-authors">${gmName(g.authors||'')}</div>
          <div class="grant-funder">${esc(g.funder||'')}</div>
        </div>
        <div class="grant-right">
          <div class="grant-amount">${esc(g.amount||'')}</div>
          <div class="grant-year">${esc(g.years||'')}</div>
        </div>
      </div>`).join('');
    document.getElementById('grants-content').innerHTML =
      html || '<p style="color:var(--text-muted);padding:2rem 0">No grants found in content.json.</p>';
  })
  .catch(err => {
    document.getElementById('grants-content').innerHTML =
      '<p style="color:var(--text-muted);padding:2rem 0">Could not load grants. Please ensure content.json is in the same folder.</p>';
    console.warn('grants: could not load content.json:', err.message);
  });
</script>
</body>
</html>
